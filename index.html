<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream Direct Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .badge { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,0.85); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; z-index: 10; pointer-events: none; border: 1px solid rgba(255,255,255,0.2); }
    .dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .play-btn { position: absolute; z-index: 20; background: #ef4444; color: #fff; border: none; padding: 16px 36px; border-radius: 50px; font-size: 17px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 4px 20px rgba(239,68,68,0.5); }
    .play-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><span class="dot"></span><span id="st">লাইভ লোড হচ্ছে...</span></div>
    <button class="play-btn" id="pBtn" onclick="userClickPlay()">▶ ক্লিক করে চালান</button>
    <video id="v" controls autoplay playsinline></video>
  </div>
  <script>
    // URL থেকে ?url= প্যারামিটার নিন অথবা ডিফল্ট স্ট্রিম ব্যবহার করুন
    const urlParams = new URLSearchParams(window.location.search);
    const streamUrl = urlParams.get('url') || "https://a121.azplay49.me/hls/streama269241/index.m3u8?cst=3e74aca8de8568fcd4e3b9863a0956e8";
    
    const video = document.getElementById('v');
    const st = document.getElementById('st');
    const pBtn = document.getElementById('pBtn');

    function userClickPlay() {
      video.play().then(() => {
        pBtn.style.display = 'none';
        st.innerText = 'লাইভ চলছে';
        st.style.color = '#4ade80';
      }).catch(e => console.error(e));
    }

    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30
      });

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        st.innerText = 'লাইভ চলছে';
        st.style.color = '#4ade80';
        video.play().catch(function() {
          pBtn.style.display = 'block';
          st.innerText = 'প্লে বাটনে ক্লিক করুন';
          st.style.color = '#fbbf24';
        });
      });

      hls.on(Hls.Events.ERROR, function (e, data) {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            st.innerText = 'রিকানেক্ট হচ্ছে...';
            hls.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else {
            st.innerText = 'স্ট্রিম অফলাইন বা শেষ হয়েছে';
            st.style.color = '#ef4444';
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function () {
        video.play().catch(function() {
          pBtn.style.display = 'block';
        });
      });
    }
  </script>
</body>
</html>
